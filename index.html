const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
async function derive(u,p){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(SALT),iterations:ITER},base,256))}
async function open_(raw){const k=await keyFrom(raw);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},k,b64(CT));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
(async()=>{try{const s=localStorage.getItem('appstk_k_'+SALT);if(s)await open_(b64(s))}catch(e){try{localStorage.removeItem('appstk_k_'+SALT)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('m');b.disabled=true;m.textContent='';
