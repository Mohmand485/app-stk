<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App_stk — live watchlist</title>
<style>
.viz-root{color-scheme:light;
  --surface-0:#f4f4f2;--surface-1:#fcfcfb;--border:#e3e2de;--grid:#ecebe7;
  --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7974;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--bench:#8a8984;
  --up:#d1322f;--down:#12823b;--accent:#2a78d6;
  --buy-bg:#fde8e7;--hold-bg:#e7f0fb;--sell-bg:#e5f4ea;--watch-bg:#fdf3dc;--avoid-bg:#efeeeb;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;
  --surface-0:#111110;--surface-1:#1a1a19;--border:#2e2d2b;--grid:#262624;
  --text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#8f8e86;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--bench:#8f8e86;
  --up:#ef6461;--down:#3fb26a;--accent:#3987e5;
  --buy-bg:#3a1f1e;--hold-bg:#1c2a3d;--sell-bg:#17301f;--watch-bg:#382d12;--avoid-bg:#262624;}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0)}
.viz-root{font:14px/1.45 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text-primary);background:var(--surface-0);min-height:100vh;padding:20px 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--text-secondary);font-size:13px}
.muted{color:var(--text-muted)}
.banner{background:var(--watch-bg);border:1px solid var(--s4);border-radius:8px;padding:10px 14px;margin:12px 0;font-weight:600}
section{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-1);position:relative}
.card .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.card .nm{font-weight:650;font-size:16px}
.card .px{font-size:24px;font-weight:650;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.03em;padding:3px 9px;border-radius:999px;margin-top:6px}
.b-BUY{background:var(--buy-bg);color:var(--up)} .b-SELL{background:var(--sell-bg);color:var(--down)}
.b-HOLD{background:var(--hold-bg);color:var(--accent)} .b-WATCH{background:var(--watch-bg);color:var(--text-primary)}
.b-AVOID{background:var(--avoid-bg);color:var(--text-secondary)}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--text-secondary);font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{color:var(--text-secondary);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
.tbl{overflow-x:auto;margin-top:10px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.seg button{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}.seg button+button{border-left:none}
.seg button.on{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text-secondary);margin:6px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.tip b{font-weight:650}
.note{font-size:12px;color:var(--text-muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.mg{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 10px;margin:3px 4px 3px 0;font-size:13px;background:var(--surface-1)}
.chip button{border:none;background:var(--grid);color:var(--text-secondary);border-radius:999px;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1}
.chip.pending{border-style:dashed}
.chip.sel{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.pick .chip{cursor:pointer;padding:4px 10px}
input.f{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-1);color:var(--text-primary);width:110px}
button.go{font:inherit;font-size:14px;padding:7px 14px;border-radius:7px;border:1px solid var(--text-primary);background:var(--text-primary);color:var(--surface-1);cursor:pointer}
button.go:disabled{opacity:.4;cursor:default}
.msg{font-size:12px;color:var(--text-muted);min-height:16px;margin-top:6px}
.err{color:var(--up)}
.sg{position:absolute;top:100%;left:0;z-index:20;display:flex;flex-direction:column;min-width:260px;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);overflow:hidden}
.sg:empty{display:none}.sg button{all:unset;cursor:pointer;padding:9px 12px;font-size:14px;border-bottom:1px solid var(--grid)}.sg button:hover,.sg button:focus{background:var(--grid)}
.cards.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}.cards.wide th,.cards.wide td{padding:6px 5px}
details summary{cursor:pointer;color:var(--text-secondary);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="viz-root"><div class="wrap" id="app"></div></div>
<script>
let D=null;
const COL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
const $=s=>document.querySelector(s);
const pct=(x,d=1)=>x==null||isNaN(x)?'—':(x>0?'+':'')+(x*100).toFixed(d)+'%';
const upct=(x,d=0)=>x==null||isNaN(x)?'—':(x*100).toFixed(d)+'%';
const num=(x,d=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(d);
const cls=x=>x==null?'':x>0?'up':x<0?'down':'';
const cp=(x,d=1)=>`<span class="${cls(x)}">${pct(x,d)}</span>`;
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
function niceTicks(lo,hi,n=5){const span=hi-lo||1;const mag=Math.pow(10,Math.floor(Math.log10(span/n)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||mag*10;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out}
const ICON={BUY:'▲',SELL:'▼',HOLD:'■',WATCH:'◆',AVOID:'○'};

function render(){
  const app=$('#dash');
  app.innerHTML=`
  <section><h2>Today's signals${D.intraday?' <span class="badge b-WATCH">provisional</span>':''}</h2>
   <div class="sub">Swing rules, ${pct(-D.stop_loss,0)} hard stop. Alerts only — you place every trade yourself.</div>
   <div class="cards" id="cards"></div></section>
  <section id="fc"></section>
  <section id="lm"></section>
  <section><h2>History — price vs ${D.benchmark.name}</h2>
   <div class="sub">Indexed to 100 at the start of the selected range</div>
   <div class="controls"><div class="seg" id="rng"></div></div>
   <div class="pick" id="pick"></div><div class="note" style="margin-top:0">Pick up to 4 stocks to compare.</div>
   <div class="legend" id="lg1"></div><div class="chart" id="c1"></div>
   <div class="tbl" id="histTbl"></div>
   <div class="note">Volatility = annualised std. dev. of daily returns (1Y). Max DD = largest peak-to-trough fall. Beta vs each stock's own index (ChiNext / CSI 300 / Hang Seng / S&amp;P 500): 1.5 means the stock tends to move 1.5× the index. HK/US prices are in HKD/USD.</div></section>
  <section id="wm"></section>
  <section><h2>Current situation</h2><div class="tbl" id="curTbl"></div>
   <div class="grid2" style="margin-top:14px"><div><h2 style="font-size:15px">How they move together (1Y daily correlation)</h2><div class="tbl" id="corr"></div>
   <div class="note">Near 1 = they rise and fall together, so holding all four gives little diversification.</div></div>
   <div id="fund"></div></div></section>
  <section><h2>Outlook — range of ${D.outlook_days}-day outcomes</h2>
   <div class="sub">Resampled from each stock's last ~2 years of daily moves (trend removed). A statistical range, <b>not a price prediction</b>.</div>
   <div class="legend"><span><i style="background:var(--text-secondary);height:2px"></i>5–95% range</span><span><i style="background:var(--text-secondary);height:9px;opacity:.55"></i>25–75% range</span><span><i style="background:var(--text-primary);width:3px;height:12px"></i>median</span><span><i style="background:none;border-top:2px dashed var(--down);height:0"></i>${pct(-D.stop_loss,0)} stop</span></div>
   <div class="chart" id="c2"></div><div class="tbl" id="outTbl"></div></section>
  <section><h2>Backtest — would the signal rules have worked?</h2>
   <div class="sub">One position at a time, buy at next open after a signal, T+1 and price limits respected, costs ≈${((D.costs.commission*2+D.costs.slippage*2+D.costs.stamp_duty)*100).toFixed(2)}% per round trip.</div>
   <div class="tbl" id="btTbl"></div>
   <div class="controls"><span class="sub">Equity curve:</span><div class="seg" id="btSel"></div></div>
   <div class="legend" id="lg3"></div><div class="chart" id="c3"></div>
   <h2 style="font-size:15px;margin-top:16px">Stop-width sensitivity</h2><div class="tbl" id="sens"></div>
   <details><summary>Trade list for selected stock</summary><div class="tbl" id="trades"></div></details>
   <div class="note">Past results don't guarantee future ones. Rules: enter on a 20-day-high breakout with ≥${D.rules.breakout_vol_ratio}× volume, or a MACD turn-up, only while above a rising MA20 and above MA60 with RSI &lt; ${D.rules.rsi_max_entry}. Exit on the ${pct(-D.stop_loss,0)} stop, a close below MA20, or an ${upct(D.rules.trail_pct)} trailing stop once up ${upct(D.rules.trail_activate)}.</div></section>
  <div class="note" style="margin-top:10px">Source: ${D.source} · benchmark ${D.benchmark.name} (${D.benchmark.code}).</div>`;

  $('#cards').innerHTML=D.stocks.map((s,i)=>{const a=s.action,k=a.action.split(' ')[0];const c=s.current;
    return `<div class="card"><div class="nm">${s.name} <span class="muted" style="font-weight:400">${codeOf(s.code)}${s.market!=='A'?' · '+s.market:''}</span></div>
    <div class="px">${num(c.close)} <span style="font-size:15px" class="${cls(c.chg)}">${pct(c.chg,2)}</span></div>
    <div class="sub">${c.trend}${s.holding?` · you hold from ${num(s.holding.entry)}`:''}</div>
    <span class="badge b-${k}">${ICON[k]||''} ${a.action}${a.stop?` · stop ${num(a.stop)}`:''}</span>
    <ul>${a.reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div>`}).join('');

  const H=['1W','1M','3M','6M','YTD','1Y','3Y'];
  $('#histTbl').innerHTML=`<table><tr><th>Stock</th>${H.map(h=>`<th>${h}</th>`).join('')}<th>Volatility</th><th>Max DD 1Y</th><th>Max DD all</th><th>Beta</th><th>From 52w high</th></tr>
   ${D.stocks.map(s=>{const h=s.history;return `<tr><td>${s.name}</td>${H.map(k=>`<td>${cp(h[k])}</td>`).join('')}<td>${upct(h.vol_1y)}</td><td>${pct(h.mdd_1y,0)}</td><td>${pct(h.mdd_all,0)}</td><td>${num(h.beta_1y)}</td><td>${pct(h.from_52w_high,0)}</td></tr>`}).join('')}</table>`;

  $('#curTbl').innerHTML=`<table><tr><th>Stock</th><th>Close</th><th>MA20</th><th>MA60</th><th>MA20 slope (5d)</th><th>RSI 14</th><th>MACD</th><th>Volume vs 20d</th><th>Daily range (ATR)</th><th>Turnover</th></tr>
   ${D.stocks.map(s=>{const c=s.current;return `<tr><td>${s.name}</td><td>${num(c.close)}</td><td>${num(c.ma20)}</td><td>${num(c.ma60)}</td><td>${cp(c.ma20_slope_5d)}</td><td>${num(c.rsi,0)}${c.rsi>=70?' (hot)':c.rsi<=30?' (oversold)':''}</td><td>${c.macd_state}</td><td>${num(c.vol_ratio,1)}×</td><td>${upct(c.atr_pct,1)}</td><td>${c.turnover==null?'—':num(c.turnover,1)+'%'}</td></tr>`}).join('')}</table>`;

  const codes=D.stocks.map(s=>s.code),nm=Object.fromEntries(D.stocks.map(s=>[s.code,s.name]));
  $('#corr').innerHTML=`<table><tr><th></th>${codes.map(c=>`<th>${nm[c]}</th>`).join('')}</tr>${codes.map(a=>`<tr><td>${nm[a]}</td>${codes.map(b=>{const v=D.corr[a][b];const al=a===b?0:Math.max(0,v)*55;return `<td style="background:color-mix(in srgb, var(--s1) ${al}%, transparent)">${a===b?'—':num(v)}</td>`}).join('')}</tr>`).join('')}</table>`;
  const hasF=D.stocks.some(s=>s.info&&Object.keys(s.info).length);
  $('#fund').innerHTML='<h2 style="font-size:15px">Fundamentals snapshot</h2>'+(hasF?`<div class="tbl"><table><tr><th>Stock</th><th>Industry</th><th>Mkt cap (亿)</th><th>PE TTM</th><th>PB</th></tr>${D.stocks.map(s=>{const f=s.info||{};return `<tr><td>${s.name}</td><td>${f.industry||'—'}</td><td>${f.mkt_cap_bn??'—'}</td><td>${f.pe_ttm??'—'}</td><td>${f.pb??'—'}</td></tr>`}).join('')}</table></div><div class="note">Negative PE = loss-making over the last 12 months.</div>`:'<div class="note">Not available in this run.</div>');

  $('#outTbl').innerHTML=`<table><tr><th>Stock</th><th>Bad case (5%)</th><th>25%</th><th>Median</th><th>75%</th><th>Good case (95%)</th><th>Chance up</th><th>Chance of touching ${pct(-D.stop_loss,0)}</th><th>Chance of touching +10%</th></tr>
   ${D.stocks.map(s=>{const o=s.outlook;return `<tr><td>${s.name}</td><td>${cp(o.p5)}</td><td>${cp(o.p25)}</td><td>${cp(o.p50)}</td><td>${cp(o.p75)}</td><td>${cp(o.p95)}</td><td>${upct(o.p_up)}</td><td>${upct(o.p_hit_stop)}</td><td>${upct(o.p_hit_plus10)}</td></tr>`}).join('')}</table>`;

  $('#btTbl').innerHTML=`<table><tr><th>Stock</th><th>Trades</th><th>Win rate</th><th>Avg win</th><th>Avg loss</th><th>Profit factor</th><th>Avg days held</th><th>Strategy return</th><th>Strategy max DD</th><th>Buy &amp; hold</th><th>B&amp;H max DD</th><th>Time in market</th></tr>
   ${D.stocks.map(s=>{const b=s.backtest.stats;return `<tr><td>${s.name}</td><td>${b.trades}</td><td>${upct(b.win_rate)}</td><td>${cp(b.avg_win)}</td><td>${cp(b.avg_loss)}</td><td>${num(b.profit_factor)}</td><td>${num(b.avg_days,1)}</td><td>${cp(b.total_return,0)}</td><td>${pct(b.max_dd,0)}</td><td>${cp(b.buy_hold,0)}</td><td>${pct(b.buy_hold_dd,0)}</td><td>${upct(b.exposure)}</td></tr>`}).join('')}</table>
   <div class="note">Period: ${D.stocks[0].backtest.stats.period}. Profit factor above 1 = gains outweighed losses.</div>`;
  $('#sens').innerHTML=`<table><tr><th>Stock</th>${D.stocks[0].stop_sensitivity.map(x=>`<th>Stop ${pct(-x.stop,0)}: return</th><th>win rate</th>`).join('')}</tr>${D.stocks.map(s=>`<tr><td>${s.name}</td>${s.stop_sensitivity.map(x=>`<td>${cp(x.total_return,0)}</td><td>${upct(x.win_rate)}</td>`).join('')}</tr>`).join('')}</table>
   <div class="note">If a wider stop does much better, −5% may be too tight for these stocks' normal daily swings (compare with the ATR column above).</div>`;

  const ranges=[['3M',60],['6M',120],['1Y',250],['3Y',750]];let cur=250;
  $('#rng').innerHTML=ranges.map(([l,n])=>`<button data-n="${n}" class="${n===cur?'on':''}">${l}</button>`).join('');
  $('#rng').onclick=e=>{if(!e.target.dataset.n)return;cur=+e.target.dataset.n;[...$('#rng').children].forEach(b=>b.classList.toggle('on',+b.dataset.n===cur));drawPrice(cur)};
  drawPick();
  drawPrice(cur);
  drawOutlook();
  $('#btSel').innerHTML=D.stocks.map((s,i)=>`<button data-i="${i}" class="${i===0?'on':''}">${s.name}</button>`).join('');
  $('#btSel').onclick=e=>{if(e.target.dataset.i==null)return;const sel=+e.target.dataset.i;[...$('#btSel').children].forEach(b=>b.classList.toggle('on',+b.dataset.i===sel));drawBT(sel)};
  drawBT(0);
  renderFC();renderLM();renderWM();
}

function lineChart(host,{dates,series,yfmt,baseline,height=320}){
  host.innerHTML='';const W=Math.max(320,host.clientWidth||900),H=height,m={l:52,r:16,t:10,b:28};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'},host);
  const tip=document.createElement('div');tip.className='tip';host.appendChild(tip);
  const all=series.flatMap(s=>s.values.filter(v=>v!=null));let lo=Math.min(...all,baseline??Infinity),hi=Math.max(...all,baseline??-Infinity);const pad=(hi-lo)*.06;lo-=pad;hi+=pad;
  const x=i=>m.l+(W-m.l-m.r)*i/(dates.length-1),y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  niceTicks(lo,hi,5).forEach(t=>{el('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:'var(--grid)','stroke-width':1},svg);const tx=el('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end','font-size':11,fill:'var(--text-muted)'},svg);tx.textContent=yfmt(t)});
  if(baseline!=null)el('line',{x1:m.l,x2:W-m.r,y1:y(baseline),y2:y(baseline),stroke:'var(--text-muted)','stroke-width':1},svg);
  const nt=Math.min(W<500?3:6,dates.length);for(let k=0;k<nt;k++){const i=Math.round((dates.length-1)*k/(nt-1));const tx=el('text',{x:x(i),y:H-8,'text-anchor':k===0?'start':k===nt-1?'end':'middle','font-size':11,fill:'var(--text-muted)'},svg);tx.textContent=dates[i]}
  series.forEach(s=>{let d='';s.values.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)});el('path',{d,fill:'none',stroke:s.color,'stroke-width':s.width||2,'stroke-dasharray':s.dash||'','stroke-linejoin':'round','stroke-linecap':'round'},svg)});
  const vline=el('line',{y1:m.t,y2:H-m.b,stroke:'var(--text-muted)','stroke-width':1,visibility:'hidden'},svg);
  const dots=series.map(s=>el('circle',{r:4,fill:s.color,stroke:'var(--surface-1)','stroke-width':2,visibility:'hidden'},svg));
  const hit=el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'transparent'},svg);
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(dates.length-1,Math.round((px-m.l)/(W-m.l-m.r)*(dates.length-1))));
    vline.setAttribute('x1',x(i));vline.setAttribute('x2',x(i));vline.setAttribute('visibility','visible');
    series.forEach((s,k)=>{const v=s.values[i];if(v==null){dots[k].setAttribute('visibility','hidden');return}dots[k].setAttribute('cx',x(i));dots[k].setAttribute('cy',y(v));dots[k].setAttribute('visibility','visible')});
    tip.innerHTML=`<div class="muted">${dates[i]}</div>`+series.map(s=>`<div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></span>${s.name}: <b>${s.values[i]==null?'—':yfmt(s.values[i],true)}</b></div>`).join('');
    tip.style.display='block';const hx=(x(i)/W)*r.width;tip.style.left=(hx>r.width*.6?hx-tip.offsetWidth-12:hx+12)+'px';tip.style.top='10px'};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerleave',()=>{tip.style.display='none';vline.setAttribute('visibility','hidden');dots.forEach(d=>d.setAttribute('visibility','hidden'))});
}

let PICK=null;
const colOf=code=>COL[PICK.filter(c=>c).sort((a,b)=>D.stocks.findIndex(s=>s.code===a)-D.stocks.findIndex(s=>s.code===b)).indexOf(code)];
function drawPick(){

  const vm=roll(d.volume,20,mean);d.vol_ratio=d.volume.map((v,i)=>i&&vm[i-1]?v/vm[i-1]:null);
  const hh=roll(d.high,CFG.rules.breakout_lookback,a=>Math.max(...a));d.hh=hh.map((_,i)=>i?hh[i-1]:null);
  d.ret=c.map((x,i)=>i?x/c[i-1]-1:null);return d}

  const b=okn(d.hh[i])&&okn(d.vol_ratio[i])&&c>d.hh[i]&&d.vol_ratio[i]>=R.breakout_vol_ratio;
  const x=i>0&&okn(d.macd[i])&&okn(d.macd[i-1])&&d.macd[i]>0&&d.macd[i-1]<=0;

  if(c>d.ma20[i]&&c>d.ma60[i]){const why=[`Uptrend, but no breakout/MACD trigger today (RSI ${d.rsi[i].toFixed(0)})`,`Trigger: close above ${d.hh[i].toFixed(2)} on ≥${CFG.rules.breakout_vol_ratio}x volume`];
    if(d.rsi[i]>=CFG.rules.rsi_max_entry)why[0]=`Uptrend but overheated (RSI ${d.rsi[i].toFixed(0)} ≥ ${CFG.rules.rsi_max_entry})`;return {action:'WATCH',stop:null,reasons:why}}
  return {action:'AVOID',stop:null,reasons:[`Below MA20 (${d.ma20[i].toFixed(2)}) or MA60 (${d.ma60[i].toFixed(2)}): no swing setup`]}}
function correlation(list){const maps=list.map(s=>new Map(s._d.date.map((x,i)=>[x,s._d.ret[i]])));const all=[...new Set(list.flatMap(s=>s._d.date))].sort().slice(-250);const out={};
  list.forEach((a,ia)=>{out[a.code]={};list.forEach((b,ib)=>{const pr=all.filter(t=>okn(maps[ia].get(t))&&okn(maps[ib].get(t))).map(t=>[maps[ia].get(t),maps[ib].get(t)]);
    if(pr.length<20){out[a.code][b.code]=null;return}const ma=mean(pr.map(p=>p[0])),mb=mean(pr.map(p=>p[1]));let cv=0,va=0,vb=0;for(const [x,y] of pr){cv+=(x-ma)*(y-mb);va+=(x-ma)**2;vb+=(y-mb)**2}
    out[a.code][b.code]=Math.round(cv/Math.sqrt(va*vb)*100)/100})});return out}

function lastMonth(d,bench){const n=d.close.length,k=Math.min(21,n-1),i0=n-1-k;const days=[];for(let i=i0+1;i<n;i++)days.push({date:d.date[i],ret:d.ret[i],close:d.close[i],vol:d.volume[i]});
  const rets=days.map(x=>x.ret);const best=days.reduce((a,b)=>b.ret>a.ret?b:a),worst=days.reduce((a,b)=>b.ret<a.ret?b:a);
  const bm=new Map(bench.date.map((x,i)=>[x,bench.close[i]]));const b1=bm.get(d.date[n-1]),b0=bm.get(d.date[i0]);
  const v20=mean(d.volume.slice(-20)),vp=n>40?mean(d.volume.slice(-40,-20)):null;const win=d.close.slice(i0);
  return {ret:d.close[n-1]/d.close[i0]-1,bench:b1&&b0?b1/b0-1:null,up:rets.filter(x=>x>0).length,days:rets.length,best,worst,vol1m:rets.length>2?std(rets)*Math.sqrt(250):null,
    volChange:vp?v20/vp-1:null,hi:Math.max(...d.high.slice(i0+1)),lo:Math.min(...d.low.slice(i0+1)),dd:mdd(win),daily:days}}

// ---- next day / week / month: historical odds in similar setups + walk-forward check
function regime(d,i){if(!okn(d.ma20[i])||!okn(d.ma60[i])||!okn(d.rsi[i]))return null;const r=d.rsi[i];
  return (d.close[i]>d.ma20[i]?'a':'b')+(d.ma20[i]>d.ma60[i]?'u':'d')+(r<30?0:r<50?1:r<70?2:3)}
function predict(d,stop){const n=d.close.length,H=[[1,'Next day'],[5,'Next week'],[20,'Next month']],out=[];const st=d.close.map((_,i)=>regime(d,i)),now=st[n-1];
  for(const [h,label] of H){const fut=i=>i+h<n?d.close[i+h]/d.close[i]-1:null;
    const odds=(upto,state)=>{let u=0,t=0,ua=0,ta=0;for(let i=60;i<upto-h;i++){const f=fut(i);if(f==null)continue;ta++;if(f>0)ua++;if(st[i]===state){t++;if(f>0)u++}}return {p:t>=30?u/t:(ta?ua/ta:null),n:t>=30?t:ta,cond:t>=30,base:ta?ua/ta:null}};
    const cur=odds(n,now);
    let hit=0,tot=0;for(let i=Math.max(300,n-250-h);i<n-h;i++){if(!st[i])continue;const o=odds(i+1-0,st[i]);if(o.p==null||Math.abs(o.p-0.5)<0.0001)continue;const f=fut(i);if(f==null||f===0)continue;tot++;if((o.p>0.5)===(f>0))hit++}
    const lr=[];for(let i=Math.max(1,n-500);i<n;i++)lr.push(Math.log(d.close[i]/d.close[i-1]));const m=mean(lr),r=lr.map(x=>x-m),rng=mulberry32(11+h),P=3000,fin=new Float64Array(P);
    for(let p=0;p<P;p++){let s=0,t=0;while(t<h){const s0=Math.floor(rng()*(r.length-5));for(let k=0;k<5&&t<h;k++,t++)s+=r[s0+k]}fin[p]=Math.exp(s)-1}fin.sort();const q=x=>fin[Math.round((P-1)*x)];
    const lean=cur.p==null?'—':cur.p>=0.56?'Lean up':cur.p<=0.44?'Lean down':'Coin flip';
    out.push({h,label,p_up:cur.p,n:cur.n,conditional:cur.cond,base:cur.base,lean,acc:tot?hit/tot:null,acc_n:tot,lo:q(0.05),mid:q(0.5),hi:q(0.95)})}
  const desc=now?`${now[0]==='a'?'above':'below'} MA20, MA20 ${now[1]==='u'?'above':'below'} MA60, RSI ${['<30','30–50','50–70','>70'][+now[2]]}`:'not enough data';
  return {setup:desc,rows:out}}

function marketStats(d){const c=d.close,n=c.length,last=c[n-1],o={last,date:d.date[n-1]};for(const [k,m] of [['1D',1],['1W',5],['1M',21],['3M',63],['1Y',250]])o[k]=n>m?last/c[n-m-1]-1:null;
  const yr=d.date[n-1].slice(0,4),j=d.date.findIndex(x=>x.slice(0,4)===yr);o.YTD=j>0?last/c[j-1]-1:null;o.trend=last>d.ma20[n-1]&&last>d.ma60[n-1]?'Uptrend':last<d.ma20[n-1]&&last<d.ma60[n-1]?'Downtrend':'Mixed';
  o.from_high=last/Math.max(...c.slice(-250))-1;return o}
function corrWith(sd,md,lagUS){const ms=new Map(md.date.map((x,i)=>[x,md.ret[i]]));const mdates=md.date;const pr=[];const n=sd.date.length;
  for(let i=Math.max(1,n-250);i<n;i++){if(!okn(sd.ret[i]))continue;let r;
    if(lagUS){let lo=0,hi=mdates.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(mdates[m]<sd.date[i]){k=m;lo=m+1}else hi=m-1}r=k>=0?md.ret[k]:null}else r=ms.get(sd.date[i]);
    if(okn(r))pr.push([sd.ret[i],r])}
  if(pr.length<30)return null;const a=mean(pr.map(p=>p[0])),b=mean(pr.map(p=>p[1]));let cv=0,va=0,vb=0;for(const [x,y] of pr){cv+=(x-a)*(y-b);va+=(x-a)**2;vb+=(y-b)**2}return cv/Math.sqrt(va*vb)}

    const q=WL.slice();await Promise.all([0,1,2,3].map(async()=>{while(q.length)await fetchStock(q.shift())}));
    LAST=new Date();rebuild()}
  catch(e){setStatus('Could not reach Eastmoney ('+(e.message||e)+'). Check your connection and tap Refresh.',true)}
  finally{BUSY=false;$('#rf').disabled=false}}
function rebuild(){const stocks=[];
  for(const code of WL){const c=CACHE[code];if(!c)continue;const bid=BENCHES[benchOf(code)]?benchOf(code):'0.399006';
    try{const s=analyse(code,c.name,c.kl,c.info,BENCHES[bid],HL[codeOf(code)],{flow:c.flow,analyst:c.analyst,benchName:(MARKETS.find(m=>m[0]===bid)||[])[1]||''});if(!s.backtest)s.backtest=EMPTY_BT;stocks.push(s)}catch(e){ERR[code]=e.message}}
  const bj=bjNow();const lastDate=stocks[0]?.current.date;const intraday=lastDate===bj.date&&bj.hm<15*60+5;
  D={generated:LAST?LAST.toLocaleString():'',source:'Eastmoney (live)',demo:false,stop_loss:CFG.stop,rules:CFG.rules,costs:CFG.costs,
     benchmark:CFG.bench,outlook_days:CFG.outlookDays,stocks,watchlist:WL.slice(),intraday,
     markets:MARKETS.filter(([id])=>BENCHES[id]).map(([id,label,region])=>({id,label,region,s:marketStats(BENCHES[id]),series:BENCHES[id].date.slice(-260).map((x,i,a)=>[x,BENCHES[id].close[BENCHES[id].close.length-a.length+i]])})),
     mcorr:Object.fromEntries(stocks.map(st=>[st.code,Object.fromEntries(MARKETS.filter(([id])=>BENCHES[id]).map(([id,,region])=>[id,corrWith(st._d,BENCHES[id],region==='US'&&st.market!=='US')]))])),
     bench_series:BENCH.date.slice(-750).map((x,i,a)=>[x,BENCH.close[BENCH.close.length-a.length+i]]),corr:stocks.length?correlation(stocks):{}};
  const errs=Object.entries(ERR).filter(([c])=>WL.includes(c));
  setStatus(`Live · updated ${LAST?LAST.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}`+(intraday?' · <b>market open — today\'s figures are provisional until the 15:00 close</b>':lastDate?` · last close ${lastDate}`:'')+
    (errs.length?`<div class="err">Couldn't load: ${errs.map(([c,m])=>escH(c)+' ('+escH(m)+')').join(', ')}</div>`:''));
  renderWL();renderHL();
  if(stocks.length){render()}else{$('#dash').innerHTML='<section><div class="sub">Add a stock above to see its analysis.</div></section>'}}
function setStatus(h,err){$('#st').innerHTML=err?`<span class="err">${h}</span>`:h}
const nm=c=>CACHE[c]?.name||codeOf(c);
function renderWL(){$('#wl').innerHTML=WL.length?WL.map(c=>`<span class="chip ${LOADING.has(c)?'pending':''}">${escH(nm(c))} <span class="muted">${escH(codeOf(c))}${LOADING.has(c)?' · loading…':ERR[c]?' · error':''}</span><button data-del="${escH(c)}" aria-label="Remove ${escH(c)}">×</button></span>`).join(''):'<div class="note">Empty — add a stock below.</div>'}
function renderHL(){const ks=Object.keys(HL);$('#hl').innerHTML=ks.length?`<table><tr><th>Stock</th><th>Buy price</th><th>Date</th><th>Signal</th><th>Stop now</th><th></th></tr>${ks.map(c=>{const h=HL[c],s=D&&D.stocks.find(x=>x.code===c);
  return `<tr><td>${escH(nm(c))}</td><td>${num(h.entry_price)}</td><td>${escH(h.entry_date)}</td><td>${s?escH(s.action.action):'—'}</td><td>${s&&s.action.stop?num(s.action.stop):'—'}</td><td><button class="chip" style="padding:2px 8px" data-hdel="${escH(c)}">Remove</button></td></tr>`}).join('')}</table>`:'<div class="note">Nothing yet. Add a stock you own to get HOLD/SELL alerts with your own −5% stop.</div>'}

async function addStock(code,name){const m=$('#wlm');if(WL.includes(code)){m.textContent=`${name||code} is already on your watchlist.`;return}
  WL.push(code);LS.set('appstk_watchlist',WL);$('#q').value='';$('#sg').innerHTML='';m.textContent=`Adding ${name||code}…`;
  if(!BENCH){await refreshAll();m.textContent='';return}
  await fetchStock(code);rebuild();m.innerHTML=ERR[code]?`<span class="err">${escH(code)}: ${escH(ERR[code])}</span>`:`Added ${escH(nm(code))}.`}
let sgT=null,SG=[];
function shell(){$('#app').innerHTML=`
  <h1>Watchlist dashboard</h1>
  <div class="sub" id="st">Starting…</div>
  <div class="controls" style="margin-top:8px"><button class="go" id="rf">↻ Refresh</button></div>
  <section id="manage"><h2>Watchlist &amp; holdings</h2>
   <div class="sub">Type a code, name or pinyin: A-shares (<b>600519</b>, <b>茅台</b>), Hong Kong (<b>腾讯</b>, <b>00700</b>) or US (<b>NVDA</b>, <b>AAPL</b>). Japanese and Singapore companies can be added through their US listings (e.g. <b>TM</b> for Toyota). Your lists are saved on this device.</div>
   <div class="mg" style="margin-top:12px">
    <div><div class="sub" style="font-weight:600;margin-bottom:6px">Watchlist</div><div id="wl"></div>
     <form id="wlf" class="controls" autocomplete="off" style="position:relative"><input class="f" id="q" placeholder="Code or name" aria-label="Stock code or name" style="width:200px"><button class="go" id="wlb">Add</button>
      <div id="sg" class="sg"></div></form><div class="msg" id="wlm"></div></div>
    <div><div class="sub" style="font-weight:600;margin-bottom:6px">What I hold (sets your personal −5% stop)</div><div class="tbl" id="hl"></div>
     <form id="hlf" class="controls"><input class="f" id="hc" inputmode="numeric" maxlength="6" placeholder="Code" aria-label="Code"><input class="f" id="hp" inputmode="decimal" placeholder="Buy price" aria-label="Buy price" style="width:95px"><input class="f" id="hd" type="date" aria-label="Buy date" style="width:150px"><button class="go" id="hb">Save</button></form><div class="msg" id="hlm"></div></div>
   </div></section>
  <div id="dash"></div>
  <div class="note" style="margin-top:16px">For information only, not investment advice. Signals are alerts — you place every trade yourself.</div>`;
  renderWL();renderHL();
  $('#rf').onclick=()=>refreshAll();
  $('#q').addEventListener('input',e=>{clearTimeout(sgT);const v=e.target.value.trim();if(!v){$('#sg').innerHTML='';return}
    sgT=setTimeout(async()=>{try{SG=await suggest(v);$('#sg').innerHTML=SG.slice(0,8).map((s,i)=>`<button type="button" data-sg="${i}">${escH(s.name)} <span class="muted">${escH(s.code)} · ${escH(s.type)}</span></button>`).join('')}catch(_){}},250)});
  $('#wlf').addEventListener('submit',async e=>{e.preventDefault();const v=$('#q').value.trim();const m=$('#wlm');if(!v)return;
    if(/^\d{6}$/.test(v)){addStock(v);return}if(/^\d{5}$/.test(v)){addStock('116.'+v);return}
    try{const r=SG.length?SG:await suggest(v);if(r.length)addStock(r[0].code,r[0].name);else m.innerHTML='<span class="err">No A-share found for that.</span>'}catch(_){m.innerHTML='<span class="err">Search failed — try the 6-digit code.</span>'}});
  $('#hlf').addEventListener('submit',e=>{e.preventDefault();const c=$('#hc').value.trim(),p=parseFloat($('#hp').value),d=$('#hd').value,m=$('#hlm');
    if(!/^\d{6}$/.test(c)||!(p>0)||!d){m.innerHTML='<span class="err">Enter code, buy price and date.</span>';return}
    HL[c]={entry_price:p,entry_date:d};LS.set('appstk_holdings',HL);['hc','hp','hd'].forEach(id=>$('#'+id).value='');
    if(!WL.includes(c))addStock(c);else if(BENCH)rebuild();m.textContent='Saved.'});
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-sg]');if(s){const x=SG[+s.dataset.sg];if(x)addStock(x.code,x.name);return}
  const w=e.target.closest('[data-del]');if(w){WL=WL.filter(c=>c!==w.dataset.del);LS.set('appstk_watchlist',WL);if(BENCH)rebuild();else renderWL();return}
  const h=e.target.closest('[data-hdel]');if(h){delete HL[h.dataset.hdel];LS.set('appstk_holdings',HL);if(BENCH)rebuild();else renderHL()}});
shell();refreshAll();
let rt;window.addEventListener('resize',()=>{if(!D||!D.stocks.length)return;clearTimeout(rt);rt=setTimeout(()=>{const a=$('#rng .on'),b=$('#btSel .on');drawPrice(+(a?a.dataset.n:250));drawOutlook();drawBT(+(b?b.dataset.i:0));drawBars();drawWM()},150)});

</script>
</body>
</html>
